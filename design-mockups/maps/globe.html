<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spin the world</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#DCEFE2;overflow:hidden}
  svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<svg id="globe"></svg>
<script>
const HILITE = { '392': 'Japan', '704': 'Vietnam', '268': 'Georgia', '356': 'India' };
const PINS = [
  { name: 'Japan · 218 places', lon: 138.2, lat: 36.2, hero: true },
  { name: 'Vietnam',            lon: 106.0, lat: 16.0, hero: false }
];

function draw(features) {
  const w = window.innerWidth, h = window.innerHeight;
  const svg = d3.select('#globe').attr('viewBox', [0, 0, w, h]);
  svg.selectAll('*').remove();

  const r = Math.min(w, h) * 0.42;
  const proj = d3.geoOrthographic().rotate([-118, -18]).scale(r)
    .translate([w * 0.52, h * 0.5]);
  const path = d3.geoPath(proj);

  svg.append('circle').attr('cx', w * 0.52).attr('cy', h * 0.5).attr('r', r)
     .attr('fill', '#8EC8D8');
  svg.append('path').datum(d3.geoGraticule().step([20, 20])())
     .attr('d', path).attr('fill', 'none').attr('stroke', '#FFF9ED')
     .attr('stroke-width', 1).attr('opacity', 0.45);
  svg.append('g').selectAll('path').data(features).join('path')
     .attr('d', path)
     .attr('fill', d => HILITE[d.id] ? '#7FAF8A' : '#DCEFE2')
     .attr('stroke', '#FFF9ED').attr('stroke-width', 0.8)
     .attr('stroke-linejoin', 'round');
  svg.append('circle').attr('cx', w * 0.52).attr('cy', h * 0.5).attr('r', r)
     .attr('fill', 'none').attr('stroke', '#FFF9ED').attr('stroke-width', 3)
     .attr('opacity', 0.8);

  const visible = d => {
    const c = d3.geoDistance([d.lon, d.lat], [-proj.rotate()[0], -proj.rotate()[1]]);
    return c < Math.PI / 2;
  };
  const g = svg.selectAll('g.pin').data(PINS.filter(visible)).join('g')
    .attr('transform', d => `translate(${proj([d.lon, d.lat])})`);
  g.append('circle').attr('r', d => d.hero ? 13 : 10)
   .attr('fill', d => d.hero ? '#C96F4A' : '#173F35')
   .attr('stroke', '#FFF9ED').attr('stroke-width', 3.5);
  const lab = g.append('g').attr('transform', 'translate(0,-26)');
  lab.append('rect')
     .attr('x', d => -(d.name.length * 6.9 + 22) / 2).attr('y', -13)
     .attr('width', d => d.name.length * 6.9 + 22).attr('height', 26).attr('rx', 13)
     .attr('fill', d => d.hero ? '#FFF9ED' : '#173F35');
  lab.append('text').attr('text-anchor', 'middle').attr('y', 5)
     .attr('font', '600 12.5px Figtree, system-ui, sans-serif')
     .style('font', '600 12.5px Figtree, system-ui, sans-serif')
     .attr('fill', d => d.hero ? '#173F35' : '#FFF9ED')
     .text(d => d.name);
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const features = topojson.feature(topo, topo.objects.countries).features;
  draw(features);
  window.addEventListener('resize', () => draw(features));
});
</script>
</body>
</html>
