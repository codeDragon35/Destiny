<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passport world map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#FFF9ED;overflow:hidden}
  svg{display:block;width:100%;height:100%}
  .lbl{font:600 11px Figtree,system-ui,sans-serif;fill:#173F35}
</style>
</head>
<body>
<svg id="map"></svg>
<script>
// ISO numeric ids as used by world-atlas countries-110m
const VISITED = { '392': 'Japan', '144': 'Sri Lanka', '524': 'Nepal', '356': 'India' };
const PINS = [
  { name: 'Kyoto',    lon: 135.77, lat: 35.01, dx: 0,   dy: -16 },
  { name: 'Kandy',    lon: 80.64,  lat: 7.29,  dx: 26,  dy: 14 },
  { name: 'Pokhara',  lon: 83.99,  lat: 28.21, dx: 0,   dy: -16 },
  { name: 'Munnar',   lon: 77.06,  lat: 10.09, dx: -30, dy: 0 }
];

function draw(features) {
  const w = window.innerWidth, h = window.innerHeight;
  const svg = d3.select('#map').attr('viewBox', [0, 0, w, h]);
  svg.selectAll('*').remove();

  const proj = d3.geoNaturalEarth1().fitExtent([[14, 16], [w - 14, h - 16]], { type: 'Sphere' });
  const path = d3.geoPath(proj);

  svg.append('path').datum({ type: 'Sphere' }).attr('d', path)
     .attr('fill', '#8EC8D8').attr('opacity', 0.35)
     .attr('stroke', '#7FAF8A').attr('stroke-width', 1.2);

  svg.append('path').datum(d3.geoGraticule().step([20, 20])())
     .attr('d', path).attr('fill', 'none').attr('stroke', '#7FAF8A')
     .attr('stroke-width', 0.7).attr('opacity', 0.4);

  svg.append('g').selectAll('path').data(features).join('path')
     .attr('d', path)
     .attr('fill', d => VISITED[d.id] ? '#173F35' : '#DCEFE2')
     .attr('stroke', '#FFF9ED').attr('stroke-width', 0.7)
     .attr('stroke-linejoin', 'round');

  const g = svg.selectAll('g.pin').data(PINS).join('g')
    .attr('transform', d => `translate(${proj([d.lon, d.lat])})`);
  g.append('circle').attr('r', 15).attr('fill', '#C96F4A').attr('opacity', 0.2);
  g.append('circle').attr('r', 7).attr('fill', '#C96F4A')
   .attr('stroke', '#FFF9ED').attr('stroke-width', 2.5);
  g.append('text').attr('class', 'lbl')
   .attr('x', d => d.dx).attr('y', d => d.dy + 4)
   .attr('text-anchor', d => d.dx === 0 ? 'middle' : (d.dx > 0 ? 'start' : 'end'))
   .attr('stroke', '#FFF9ED').attr('stroke-width', 3).attr('paint-order', 'stroke')
   .text(d => d.name);
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const features = topojson.feature(topo, topo.objects.countries).features;
  draw(features);
  window.addEventListener('resize', () => draw(features));
});
</script>
</body>
</html>
