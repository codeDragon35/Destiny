services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: destiny
      POSTGRES_PASSWORD: destiny
      POSTGRES_DB: destiny
    # 5433 on the host: a local Postgres already occupies 5432 on this machine.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destiny -d destiny"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
